name: food_rescue_ai
description: FoodRescue AI - Connecting food donors with receivers to prevent waste.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.8.0+1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Media
  image_picker: ^1.1.2

  # Location
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # Maps
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
